name: Build et release

# - À chaque push / pull request : compilation + tests.
# - À chaque tag vX.Y.Z : publication d'une release avec les binaires prêts à l'emploi
#   (utilisés par le script Proxmox, qui n'a ainsi plus besoin du SDK .NET).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Tests
        run: dotnet test -c Release

      - name: Publication linux-x64 et win-x64 (autonomes, runtime .NET inclus)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          for RID in linux-x64 win-x64; do
            OUT="dist/nounoursautoregie-$RID"
            dotnet publish src/NAR.Engine/NAR.Engine.csproj -c Release -r "$RID" --self-contained true \
              -p:Version="${VERSION%%-*}" -p:InformationalVersion="$VERSION" -o "$OUT"
            mkdir -p "$OUT/scripts" "$OUT/samples"
            cp scripts/* "$OUT/scripts/"
            cp samples/*.json "$OUT/samples/"
            echo "$GITHUB_REF_NAME ($GITHUB_SHA)" > "$OUT/VERSION"
          done
          tar -C dist -czf dist/nounoursautoregie-linux-x64.tar.gz nounoursautoregie-linux-x64
          (cd dist && zip -qr nounoursautoregie-win-x64.zip nounoursautoregie-win-x64)

      - uses: actions/upload-artifact@v4
        with:
          name: nounoursautoregie
          path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nounoursautoregie-linux-x64.tar.gz
            dist/nounoursautoregie-win-x64.zip
          generate_release_notes: true
