name: Build et release

# - À chaque push / pull request : compilation + tests.
# - Sur main : si la version de Directory.Build.props n'a pas encore de release,
#   le workflow crée le tag vX.Y.Z et publie la release avec les binaires autonomes
#   (utilisés par le script Proxmox, qui n'a ainsi besoin d'aucun SDK .NET).
#   Pour sortir une nouvelle version : augmenter <Version> et pousser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: version
        run: |
          VERSION="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version du projet : $VERSION"

      - name: Tests
        run: dotnet test -c Release

      - name: Publication linux-x64 et win-x64 (autonomes, runtime .NET inclus)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for RID in linux-x64 win-x64; do
            OUT="dist/nounoursautoregie-$RID"
            # Serveur (régie) et moteur publiés dans le même dossier : un seul runtime .NET embarqué.
            for PROJ in NAR.Server NAR.Engine; do
              dotnet publish "src/$PROJ/$PROJ.csproj" -c Release -r "$RID" --self-contained true \
                -p:Version="$VERSION" -p:InformationalVersion="$VERSION+${GITHUB_SHA::7}" -o "$OUT"
            done
            mkdir -p "$OUT/scripts" "$OUT/samples"
            cp scripts/* "$OUT/scripts/"
            cp samples/*.json "$OUT/samples/"
            echo "v$VERSION (${GITHUB_SHA::7})" > "$OUT/VERSION"
          done
          tar -C dist -czf dist/nounoursautoregie-linux-x64.tar.gz nounoursautoregie-linux-x64
          (cd dist && zip -qr nounoursautoregie-win-x64.zip nounoursautoregie-win-x64)

      - uses: actions/upload-artifact@v4
        with:
          name: nounoursautoregie
          path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Release déjà publiée ?
        id: exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La release v${{ steps.version.outputs.version }} existe déjà : rien à publier."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.exists.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NounoursAutoRegie ${{ steps.version.outputs.version }}
          files: |
            dist/nounoursautoregie-linux-x64.tar.gz
            dist/nounoursautoregie-win-x64.zip
          generate_release_notes: true
