# Une chaîne = un conteneur moteur. Dupliquez le service pour ajouter des chaînes
# (un channel.json et un port par chaîne).
services:
  nar-nounourstv:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    container_name: nar-nounourstv
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config/nounourstv:/config      # channel.json (chemins : /media/..., hls.directory : /data/hls)
      - /srv/media:/media:ro             # médiathèque (lecture seule)
      - ./data/nounourstv:/data          # sortie HLS + journal de diffusion
