# Régie NounoursAutoRegie : elle lance elle-même un moteur par chaîne allumée.
services:
  nounoursautoregie:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nounoursautoregie
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data              # base, vignettes, HLS, journaux de diffusion
      - /srv/media:/media:ro      # médiathèque (lecture seule) : ajoutez /media dans la régie
